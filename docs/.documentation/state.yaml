  - finding_id: ARCH-001
    document: docs/architecture.md
    location: 'Section "Composition Engine" → "### 3. Execution Lifecycle Sequence"; stage diagram around line 174; numbered lifecycle list around lines 178-181.'
    problem: The document describes the load() composition pipeline as four stages — Resolve Graph, Setup, Seal, Initialize — and presents this as the complete boot sequence, omitting the fifth terminal START stage.
    evidence: "packages/composition/src/loader.ts docstring (lines 22-28) lists five stages (resolveOrder, CONFIGURE, SEAL, INITIALIZE, START); loader.ts lines 123-124 call kernel.start() and line 134 returns success(undefined). docs/getting-started.md lines 159-163 document five stages including '5. Start → Application is ready'. Manifest acceptance criterion for architecture.md: 'lifecycle sequences match kernel/composition implementation'."
    severity: P1
    required_outcome: Add the missing Stage 5 (Start) to the execution lifecycle diagram and numbered list in docs/architecture.md so the documented load() pipeline matches loader.ts and getting-started.md.
  - finding_id: DOC-002
    document: docs/architecture.md
    location: 'Section "Dependency Direction & Constraints"; Technology Adapters bullet, line 58.'
    problem: The document states Technology Adapters "Depend on their respective Core Module and Kernel packages", implying a direct Technology Adapter to @comity/kernel dependency that does not exist in the current package dependency graph.
    evidence: "Dependency metadata of all 14 @comity/* adapter packages (@comity/http-hono, http-fetch, html-react, html-preact, hydration-react, hydration-preact, sql-kysely, validation-zod, auth-jose, acl-casl, cache-redis, cache-kv, router-path-to-regexp, graphql-client-fetch) was verified: none declares a direct dependency on @comity/kernel. Adapters depend on their corresponding Core Module contracts and, where applicable, supporting primitives/composition infrastructure."
    severity: P2
    required_outcome: Correct the Technology Adapters bullet in docs/architecture.md to remove the false direct Kernel dependency and describe the adapters' actual dependency on their Core Module contracts plus supporting primitives/composition infrastructure where applicable.
  - finding_id: DOC-003
    document: docs/getting-started.md
    location: 'Section "Modules and Composition"; module setup example, lines 134-153 (deferred initialization function at lines 147-151).'
    problem: The ModuleMeta setup example returns a deferred initialization function typed () => Promise<void>, but the current ModuleSetupFn contract requires () => Promise<Result<void, BaseError>>. As written it would fail type-checking and, if executed, the composition loader would call isFailure(undefined) and throw.
    evidence: "packages/composition/src/setup/types.ts line 30 defines ModuleSetupFn = () => Promise<Result<void, BaseError>>; ModuleMeta.setup (line 71) returns Promise<Result<ModuleSetupFn, BaseError>>; packages/composition/src/loader.ts lines 108-111 call 'const result = await init(); if (isFailure(result))'. The authoritative @comity/http module (packages/http/src/setup/composition.ts) returns success(undefined) (line 64) and failure(...) (line 30) from its deferred initializer. The documented example's deferred function (lines 147-151) returns Promise<void>."
    severity: P2
    required_outcome: Make the deferred initialization function in the getting-started module setup example return a Result<void, BaseError> (successful path ends with return success(undefined);), matching the ModuleSetupFn contract and the @comity/http pattern.

