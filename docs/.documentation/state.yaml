    status: approved
    write_authorized: true
    approved_at: 2026-09-13T05:44:09Z
    authorized_changes:
      - C-01: canonical post-REJECT model — one lifecycle (review → REJECT → rejected → planned → pending_approval → approved → writing → review); no autonomous post-REJECT write; no approval-free repair-to-review path.
      - C-02: mandatory plan identity — approval.plan_id == execution.plan_id == review.plan_id; no approval without plan identity.
      - C-03: approved-plan content integrity — explicit authorization-bearing content (plan_id, document, findings, authorized_changes, forbidden_changes, scope/target paths, acceptance_criteria); content change invalidates prior approval; status changes are not content changes.
      - C-04: state ownership — distinguish authorization evidence from execution progress; Writer may not create/alter authorizing or completion evidence; Writer cannot convert progress into authorization.
      - C-05: protected-document re-entry — complete → research/re-verification → complete (no findings) or → findings → planned → pending_approval (findings); no re-verification write authorization.
