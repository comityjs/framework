# Resumable state for the Comity documentation agent loop.
# Minimal by design: enough to resume safely after interruption, nothing more.
# The repository itself remains authoritative; re-verify in-flight work on resume.
# current.document: null is a valid initial state (nothing in progress);
# select the next eligible document per AGENT.md section 18.
#
# Schema (v2, hardened Phase 4.6):
#   current: { document, phase, document_status }
#   last_completed: { document, timestamp, result, scope }
#   findings[]: { finding_id, document, location, problem, evidence, severity, required_outcome }
#   plans[]: { plan_id, document, findings[], status, write_authorized, approved_at, authorized_changes[], forbidden_changes_global[] }
#   approvals[]: { plan_id, document, decision, scope, authorized[], not_authorized, approver, timestamp, basis }
#   reviews[]: { document, plan_id, result, reviewer, timestamp, findings[], global_check }
#   blockers[]: { document, since, revision, summary, evidence, decision_needed }
#   scope_violations[]: { path, phase, timestamp }
#   last_review: { document, plan_id, result, timestamp }
#   last_run: { status, revision, working_tree, timestamp, notes[] }
#
# Plan status values: pending_approval | approved | rejected | superseded
# Review result values: PASS | REJECT | BLOCKED

