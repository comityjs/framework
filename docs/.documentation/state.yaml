      - H8G7V5-AC9: the dependency-rules and validate packages build/type-check/lint and the repository's narrower authoritative validation surface (e.g. comity validate --only dependencies / adapter-peers, and any unit test added under the authorized packages) remain passing; no unrelated repository-wide test is required.
    forbidden_changes_global:
      - modifying community/ runtime source code (H8G7V4 is package.json-only; H8G7V5 touches no community runtime package)
      - altering Core Module APIs or adapter interfaces
      - changing runtime dependency direction
      - removing existing runtime dependencies without separate explicit authorization
      - redesigning dependency-rules architecture
      - creating a new ADR-008 or rewriting ADR-008 historical documentation
      - duplicating the Core-to-Core register in unrelated places
      - weakening Core-to-Core restrictions or permitting all Core-to-Core dependencies
      - modifying unrelated package metadata or unrelated development packages
      - modifying lockfiles unless the package manager requires an unavoidable update caused solely by the authorized manifest change
      - introducing a new external dependency or dependency version
      - modifying enterprise/ or magento/
      - performing unrelated cleanup or fixing unrelated findings
      - running the Writer or Reviewer, or making any change, before explicit human approval of PLAN-H8G7V4-H8G7V5
  - plan_id: PLAN-H8G7V5-REMEDIATION-001
    related_rejected_plan: PLAN-H8G7V4-H8G7V5
    related_review: REJECT (independent reviewer, 2026-09-14T02:50:00Z)
    findings: [H8G7V5]
    status: approved
    write_authorized: true
    approved_at: 2026-09-14T03:00:00Z
    scope: >
      Re-remediation of H8G7V5 (ADR-008 Core-to-Core closed-register enforcement). Limited to
      development/packages/dependency-rules/ and development/packages/validate/. H8G7V4
      (community/packages/auth-jose/package.json) is already correctly remediated and MUST remain
      untouched. No enterprise/, magento/, community runtime, ADR-008 register, or register
      documentation changes. No new dependencies. No dependency-rules redesign.
    root_cause: >
      The production dependency-cruiser invocation (cwd=development/packages/validate, targets=community
      package directories, tsconfig without package paths) resolves internal @comity/* cross-package
      imports through node_modules, so dependency-cruiser strips them via doNotFollow and they never
      appear in the reported graph; the surviving @comity/* targets are only unresolvable subpaths
      (couldNotResolve=true), and every FROM module is a file path, so generated rules with
      from:^@comity/<pkg>$ can never match a real dependency. Empirically, providing a tsconfig whose
      paths map @comity/* to source did not surface the edges in this dependency-cruiser version.
      The generated dependency-rules config is semantically correct but cannot fire in the actual
      validation path; the prior Writer proved rule shape, not production enforcement (false-positive
      evidence pattern).
    invariant: >
      registered Core-to-Core edge is allowed/exempt; unregistered Core-to-Core edge is forbidden.
      ADR-008 register (adr008CoreExceptionRegister from @comity-dev/schemas) is the sole authority
      for approved Core-to-Core exceptions.
    approach: >
      Add a dedicated Core-to-Core closed-register check engine inside @comity-dev/validate
      (validate/src/engines/core-register.ts) that operates on the actual repository dependency graph
      (declared runtime deps unioned with actual @comity/* source imports across each core package
      src), compares every core-to-core edge against the authoritative ADR-008 register, reports each
      unregistered edge as a validation error, and accepts registered edges. Wire it into run.ts so it
      executes in the real comity validate dependencies path together with, and without weakening, the
      existing dependency-cruiser engine. Keep the existing dependency-rules build-config changes from
      PLAN-H8G7V4-H8G7V5 unchanged. This is Option D from the rejected-finding brief, justified by
      evidence that the dependency-cruiser architecture in the current invocation cannot reliably
      express package-level matching.
    rejected_alternatives: >
      (A) Correct the generated matcher for file paths: rejected because internal cross-package edges
      are absent from the dependency-cruiser graph (doNotFollow + node_modules resolution), so no
      matcher can fire on them. (B) Correct the invocation via tsconfig paths: empirically rejected;
      this dependency-cruiser version did not surface the edges under a paths-mapped tsconfig.
      (C) Build rules from file/module paths: same blocker as (A); the edges are not present in the
      cruised graph. Only Option D (separate actual-graph engine) provides reliable enforcement.
    expected_files:
      - path: development/packages/validate/src/engines/core-register.ts
        change: new Core-to-Core closed-register check engine (implementation)
        why: provides pipeline-wired enforcement of the ADR-008 register on the actual repository dependency graph
      - path: development/packages/validate/src/run.ts
        change: wire the new engine into the dependencies validation category (implementation)
        why: makes the enforcement part of the real comity validate production path
      - path: development/packages/validate/src/__tests__/core-register.test.ts
        change: permanent integration test for positive and negative closed-register behaviour (test)
        why: reproducible production-path proof and regression protection
    implementation_steps: >
      (1) Add a pure engine function that takes a Repository and an optional register (defaulting to
      adr008CoreExceptionRegister), builds the actual Core-to-Core edge set from declared runtime
      deps (dependencies + peerDependencies + optionalDependencies) AND from actual source imports
      (scan each core package src for from "@comity/x" or import("@comity/x"), normalize to the base
      @comity package, exclude tests and dist), and returns the unregistered edges. (2) Wrap it in
      runCoreRegister(repo) returning an EngineResult with findings (tool 'core-register', rule
      'ADR-008-CORE-REGISTER', severity error). (3) Wire into run.ts so the dependencies category runs
      both dependency-cruiser and the new engine and requires both to pass; preserve all existing
      engine behaviour. (4) Type-check and build validate.
    test_strategy: >
      Integration tests in validate/src/__tests__/core-register.test.ts build synthetic Repository
      objects (PackageRecord shape) and assert: (1) a registered edge is accepted; (2) a
      non-registered Core-to-Core edge is reported; (3) passing a register that omits a currently
      registered exemption causes the real applied edge to be reported (removal detection). Then run
      tsc -p on validate and dependency-rules, and run the real engine on the discovered community
      repository to confirm 0 violations (all 17 declared Core-to-Core edges are registered).
    production_path_negative_proof: >
      The AC5 negative proof runs the real engine logic on the production repository shape: the test
      injects a register that omits a currently registered edge (for example omit storefront->catalog
      or address->validation) and asserts the engine reports that edge as a violation, and also
      builds a synthetic repo with an unregistered Core-to-Core pair and asserts rejection. This
      exercises the engine wired into the production pipeline, not merely the generated-rule shape.
    production_path_positive_proof: >
      Run the real engine on the discovered community repository (all 17 declared Core-to-Core edges
      are registered) and assert 0 violations; the test's registered-edge case also asserts acceptance.
    acceptance_criteria:
      - H8G7V5-AC1: ADR-008 register (adr008CoreExceptionRegister) remains the sole authoritative Core-to-Core exception source; reused, not duplicated or hard-coded.
      - H8G7V5-AC2: registered Core-to-Core edges are accepted.
      - H8G7V5-AC3: unregistered Core-to-Core edges are rejected.
      - H8G7V5-AC4: the actual production comity validate dependencies path enforces AC2 and AC3 via the newly wired engine.
      - H8G7V5-AC5: injecting a register that omits a currently registered exemption causes the real engine to reject that edge.
      - H8G7V5-AC6: unrelated dependency/layer rules are not weakened; dependency-cruiser engine still runs; tsc + unit tests pass.
      - H8G7V5-AC7: no Community runtime code is modified.
      - H8G7V5-AC8: no duplicate register or hard-coded current exception list is introduced.
      - H8G7V5-AC9: no new external dependency is introduced.
      - H8G7V5-AC10: type-check of affected dev packages and unit tests pass.
      - H8G7V5-AC11: final changed files are limited to the expected_files set.
    scope_restrictions: >
      Only the files listed under expected_files may change. community/packages/auth-jose/package.json
      (H8G7V4) must not be modified. No ADR-008 register, data, or documentation changes. No new
      dependencies. No lockfile change unless the package manager forces it solely from an authorized
      manifest change (none expected for this plan). Do not commit rebuilt dist. No enterprise/ or
      magento/. Writer must not redesign dependency-rules and must keep its prior changes intact.
    lockfile_dependency_policy: >
      No new external dependency. @comity-dev/schemas is already a dependency of @comity-dev/validate.
      No lockfile change is expected or required. If an unavoidable lockfile update results solely from
      an authorized manifest change, only that resulting content is permitted.
    rollback_safety: >
      The new engine is additive; existing engines are unchanged. On regression, remove the engine
      wiring in run.ts and the two new files. No effect on published package manifests or ADR-008 data.





