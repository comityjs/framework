name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Validate packed surface
        env:
          COMITY_PACKED_SURFACE_ENFORCEMENT: ${{ vars.COMITY_PACKED_SURFACE_ENFORCEMENT }}
        run: |
          if [ "$COMITY_PACKED_SURFACE_ENFORCEMENT" = "true" ]; then
            echo "packed-surface enforcement is active: a stage-2 finding blocks publication"
            pnpm validate:packed-surface
          else
            echo "::warning::packed-surface enforcement is inactive (COMITY_PACKED_SURFACE_ENFORCEMENT is not \"true\"); reporting ARCH-PACK findings without blocking publication. Activate only after WP-A1, WP-A4 and WP-B formal ratification."
            pnpm validate:packed-surface || true
          fi

      - name: Release
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          createGithubReleases: true
        env:
          NPM_TOKEN: ${{ secrets.COMITY_NPM_TOKEN }}
