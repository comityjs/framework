name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Semgrep
        run: |
          pip3 install semgrep

      - name: Validate
        run: pnpm validate

      - name: Type-check
        run: pnpm -r exec tsc -p tsconfig.json --noEmit

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm exec eslint --ext .ts packages/

      - name: Normalize package-json
        run: pnpm normalize:package-json:check

      - name: Normalize exports
        run: pnpm normalize:exports:check

      - name: Check formatting
        run: pnpm exec prettier --check .
